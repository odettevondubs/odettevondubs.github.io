<html lang="de">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  header {

    font-weight: 400;
    color: var(--sand);

  }

  header .back-link {
    font-size: 0.78rem;
    color: var(--sand);
    text-decoration: none;
    opacity: 0.75;

  }

  .hero {

  }

  .hero-eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sand);
    opacity: 0.65;

  .mat-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--text);

  .mat-badge {
    font-size: 0.7rem;
    color: var(--text-muted);
    background: var(--sand);
    border: 1px solid var(--sand-dark);
    border-radius: 99px;
    padding: 2px 9px;
    letter-spacing: 0.03em;
  }
  .mat-chevron {
    font-size: 1rem;
    color: var(--text-muted);
    transition: transform 0.2s;
    display: inline-block;
  }
  .mat-header.open .mat-chevron { transform: rotate(90deg); }

  .mat-body {
    display: none;
    border-top: 1px solid var(--sand-dark);
  }
  .mat-body.open { display: block; }

  .cat-group { border-bottom: 1px solid #f0ebe0; }

  .cat-header {
    display: flex;
    align-items: center;

    font-size: 0.82rem;

    letter-spacing: 0.04em;

  .cat-count {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 5px;
    text-transform: none;
    letter-spacing: 0;
  }
  .cat-chevron {
    font-size: 0.9rem;
    color: var(--text-muted);
    transition: transform 0.2s;
    display: inline-block;
  }
  .cat-header.open .cat-chevron { transform: rotate(90deg); }

  .cat-body { display: none; }
  .cat-body.open { display: block; }

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 18px 13px 44px;
    border-bottom: 1px solid #f5f1e8;
    text-decoration: none;
    transition: background 0.12s;

  .product-link:last-child { border-bottom: none; }
  .product-link:hover { background: var(--sand); }

    font-size: 0.85rem;
    color: var(--text);
    font-weight: 400;
    line-height: 1.4;

  .prod-brand {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .ext {
    font-size: 0.8rem;
    color: var(--text-muted);
    flex-shrink: 0;
    margin-left: 12px;
  }

  .disclaimer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0 24px 40px;

    text-align: center;
    font-size: 0.75rem;
    color: var(--sand);
    opacity: 0.8;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .hero { padding: 40px 20px 48px; }
    .content { padding: 16px 14px 48px; }
  }
</style>
</head>

const acc = document.getElementById('accordion');

data.forEach(m => {
  const total = m.cats.reduce((s, c) => s + c.products.length, 0);

  const mg = document.createElement('div');
  mg.className = 'mat-group';

  const mh = document.createElement('div');
  mh.className = 'mat-header';
  mh.innerHTML = `
    <div class="mat-left">
      <span class="mat-emoji">${m.emoji}</span>
      <span class="mat-name">${m.mat}</span>
      <span class="mat-badge">${total} Produkte</span>
    </div>
    <span class="mat-chevron">›</span>
  `;

  const mb = document.createElement('div');
  mb.className = 'mat-body';

  m.cats.forEach(c => {
    const cg = document.createElement('div');
    cg.className = 'cat-group';

    const ch = document.createElement('div');
    ch.className = 'cat-header';
    ch.innerHTML = `
      <span><span class="cat-name">${c.cat}</span><span class="cat-count">(${c.products.length})</span></span>
      <span class="cat-chevron">›</span>
    `;

    const cb = document.createElement('div');
    cb.className = 'cat-body';

    c.products.forEach(p => {
      const a = document.createElement('a');
      a.className = 'product-link';
      a.href = p.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div>
          <div class="prod-name">${p.name}</div>
          <div class="prod-brand">${p.brand}</div>
        </div>
        <span class="ext">↗</span>
      `;
      cb.appendChild(a);
    });

    ch.addEventListener('click', () => {
      cb.classList.toggle('open');
      ch.classList.toggle('open');
    });

    cg.appendChild(ch);
    cg.appendChild(cb);
    mb.appendChild(cg);
  });

  mh.addEventListener('click', () => {
    mb.classList.toggle('open');
    mh.classList.toggle('open');
  });

  mg.appendChild(mh);
  mg.appendChild(mb);
  acc.appendChild(mg);
});
